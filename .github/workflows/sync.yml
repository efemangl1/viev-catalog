name: Katalog güncelle

# Sitelerdeki ürünleri tarar ve data/catalog.json dosyasını günceller.
# Uygulama bu dosyayı internetten okur; siteye ürün yüklenince en geç bir saat içinde uygulamada görünür.
on:
  schedule:
    - cron: '0 * * * *' # her saat başı (UTC)
  workflow_dispatch: {} # Actions sekmesinden elle de çalıştırılabilir
  push:
    paths:
      - 'config/settings.json' # numara/adres değişince saati beklemeden hemen çalış

permissions:
  contents: write

concurrency:
  group: katalog-guncelle
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siteleri tara ve kataloğu üret
        run: node scripts/build-catalog.mjs

      # Yeni düğün paketi varsa telefonlara toplu bildirim gönderir (kurallar: config/settings.json -> bildirimler).
      # Gizli anahtarlar (Settings -> Secrets and variables -> Actions): SUPABASE_URL, SUPABASE_SERVICE_KEY.
      # Tanımlı değilse bildirim GÖNDERİLMEZ. Hata verse bile katalog güncellemesi kaydedilsin diye continue-on-error.
      - name: Yeni düğün paketi bildirimi
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/notify-new-packages.mjs

      - name: Değiştiyse kaydet
        run: |
          git config user.name "viev-catalog-bot"
          git config user.email "viev-catalog-bot@users.noreply.github.com"
          git add data/catalog.json data/notify-state.json
          if git diff --cached --quiet; then
            echo "Katalog ve bildirim durumu değişmedi."
          else
            git commit -m "Katalog güncellendi $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
